<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Sora:wght@200;300;400;600&display=swap");
    body { margin: 0; }
    a { color: #e2ab61; } a:hover { color: #c78f45; }
  </style>
</helmet>
<div style="width: 420px; height: 400px; box-sizing: border-box; background: #08080a; color: #f5f3ef; font-family: 'Sora', system-ui, sans-serif; padding: 28px 24px; display: flex; flex-direction: column; align-items: center; justify-content: space-between;">
  <svg width="372" height="316" viewBox="0 0 372 316" xmlns="http://www.w3.org/2000/svg">
    <!-- Core (dominant) -->
    <circle cx="186" cy="128" r="80" fill="none" stroke="#191a1e" stroke-width="13"></circle>
    <circle cx="186" cy="128" r="80" fill="none" stroke="#e2ab61" stroke-width="13" stroke-linecap="round" stroke-dasharray="502.65" stroke-dashoffset="90.48" transform="rotate(-90 186 128)"></circle>
    <text x="186" y="130" text-anchor="middle" fill="#f5f3ef" font-family="'Sora', system-ui, sans-serif" font-weight="200" font-size="52">82<tspan font-size="22" dy="-20">%</tspan></text>
    <text x="186" y="170" text-anchor="middle" fill="#96949d" font-family="'Sora', system-ui, sans-serif" font-weight="400" font-size="12" letter-spacing="1.5">CORE</text>

    <!-- Recovery satellite -->
    <circle cx="112" cy="252" r="36" fill="none" stroke="#191a1e" stroke-width="8"></circle>
    <circle cx="112" cy="252" r="36" fill="none" stroke="#7cc2a3" stroke-width="8" stroke-linecap="round" stroke-dasharray="226.19" stroke-dashoffset="49.76" transform="rotate(-90 112 252)"></circle>
    <text x="112" y="257" text-anchor="middle" fill="#f5f3ef" font-family="'Sora', system-ui, sans-serif" font-weight="300" font-size="20">78%</text>
    <text x="112" y="306" text-anchor="middle" fill="#96949d" font-family="'Sora', system-ui, sans-serif" font-weight="400" font-size="11" letter-spacing="1.2">RECOVERY</text>

    <!-- Sleep satellite -->
    <circle cx="260" cy="252" r="36" fill="none" stroke="#191a1e" stroke-width="8"></circle>
    <circle cx="260" cy="252" r="36" fill="none" stroke="#989cdb" stroke-width="8" stroke-linecap="round" stroke-dasharray="226.19" stroke-dashoffset="22.62" transform="rotate(-90 260 252)"></circle>
    <text x="260" y="257" text-anchor="middle" fill="#f5f3ef" font-family="'Sora', system-ui, sans-serif" font-weight="300" font-size="20">90%</text>
    <text x="260" y="306" text-anchor="middle" fill="#96949d" font-family="'Sora', system-ui, sans-serif" font-weight="400" font-size="11" letter-spacing="1.2">SLEEP</text>
  </svg>
  <div style="font-size: 11px; letter-spacing: 1.6px; color: #5b5963; text-transform: uppercase;">A · Dominant Core, two satellites</div>
</div>
</x-dc>
</body>
</html>
