<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Sora:wght@200;300;400;600&display=swap");
    body { margin: 0; }
    a { color: #e2ab61; } a:hover { color: #c78f45; }
  </style>
</helmet>
<div style="width: 420px; height: 420px; box-sizing: border-box; background: #08080a; color: #f5f3ef; font-family: 'Sora', system-ui, sans-serif; padding: 28px 24px; display: flex; flex-direction: column; align-items: center; justify-content: space-between;">
  <svg width="372" height="330" viewBox="0 0 372 330" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="gCore" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#f2cd93"></stop>
        <stop offset="1" stop-color="#d1913f"></stop>
      </linearGradient>
      <linearGradient id="gRec" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#9fd8c0"></stop>
        <stop offset="1" stop-color="#5fa587"></stop>
      </linearGradient>
      <linearGradient id="gSlp" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#b6b9ea"></stop>
        <stop offset="1" stop-color="#7a7ec5"></stop>
      </linearGradient>
    </defs>

    <!-- Core top-centre, dominant, tapered gradient arc -->
    <circle cx="186" cy="96" r="66" fill="none" stroke="#191a1e" stroke-width="12"></circle>
    <circle cx="186" cy="96" r="66" fill="none" stroke="url(#gCore)" stroke-width="12" stroke-linecap="round" stroke-dasharray="414.69" stroke-dashoffset="74.64" transform="rotate(-90 186 96)"></circle>
    <text x="186" y="98" text-anchor="middle" fill="#f5f3ef" font-family="'Sora', system-ui, sans-serif" font-weight="200" font-size="42">82<tspan font-size="18" dy="-16">%</tspan></text>
    <text x="186" y="130" text-anchor="middle" fill="#96949d" font-family="'Sora', system-ui, sans-serif" font-size="11" letter-spacing="1.5">CORE</text>

    <!-- Recovery bottom-left -->
    <circle cx="104" cy="238" r="46" fill="none" stroke="#191a1e" stroke-width="10"></circle>
    <circle cx="104" cy="238" r="46" fill="none" stroke="url(#gRec)" stroke-width="10" stroke-linecap="round" stroke-dasharray="289.03" stroke-dashoffset="63.59" transform="rotate(-90 104 238)"></circle>
    <text x="104" y="243" text-anchor="middle" fill="#f5f3ef" font-family="'Sora', system-ui, sans-serif" font-weight="300" font-size="22">78</text>
    <text x="104" y="304" text-anchor="middle" fill="#96949d" font-family="'Sora', system-ui, sans-serif" font-size="11" letter-spacing="1.3">RECOVERY</text>

    <!-- Sleep bottom-right -->
    <circle cx="268" cy="238" r="46" fill="none" stroke="#191a1e" stroke-width="10"></circle>
    <circle cx="268" cy="238" r="46" fill="none" stroke="url(#gSlp)" stroke-width="10" stroke-linecap="round" stroke-dasharray="289.03" stroke-dashoffset="28.90" transform="rotate(-90 268 238)"></circle>
    <text x="268" y="243" text-anchor="middle" fill="#f5f3ef" font-family="'Sora', system-ui, sans-serif" font-weight="300" font-size="22">90</text>
    <text x="268" y="304" text-anchor="middle" fill="#96949d" font-family="'Sora', system-ui, sans-serif" font-size="11" letter-spacing="1.3">SLEEP</text>
  </svg>
  <div style="font-size: 11px; letter-spacing: 1.6px; color: #5b5963; text-transform: uppercase;">Style 3 · Triad — gradient tapered arcs</div>
</div>
</x-dc>
</body>
</html>
