<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Sora:wght@200;300;400;600&display=swap");
    body { margin: 0; }
    a { color: #e2ab61; } a:hover { color: #c78f45; }
  </style>
</helmet>
<div style="width: 380px; height: 300px; box-sizing: border-box; background: #08080a; color: #f5f3ef; font-family: 'Sora', system-ui, sans-serif; padding: 30px 30px; display: flex; flex-direction: column; justify-content: space-between;">
  <div style="display: flex; flex-direction: column; gap: 18px;">

    <div style="display: flex; align-items: center; gap: 16px;">
      <svg width="60" height="60" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
        <circle cx="30" cy="30" r="26" fill="none" stroke="#191a1e" stroke-width="6"></circle>
        <circle cx="30" cy="30" r="26" fill="none" stroke="#e2ab61" stroke-width="6" stroke-linecap="round" stroke-dasharray="163.36" stroke-dashoffset="29.40" transform="rotate(-90 30 30)"></circle>
        <text x="30" y="35" text-anchor="middle" fill="#f5f3ef" font-family="'Sora', system-ui, sans-serif" font-weight="300" font-size="17">82</text>
      </svg>
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <span style="font-size: 15px; letter-spacing: 0.4px;">Core</span>
        <span style="font-size: 12px; color: #5b5963;">Today's physical demand</span>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 16px;">
      <svg width="60" height="60" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
        <circle cx="30" cy="30" r="26" fill="none" stroke="#191a1e" stroke-width="6"></circle>
        <circle cx="30" cy="30" r="26" fill="none" stroke="#7cc2a3" stroke-width="6" stroke-linecap="round" stroke-dasharray="163.36" stroke-dashoffset="35.94" transform="rotate(-90 30 30)"></circle>
        <text x="30" y="35" text-anchor="middle" fill="#f5f3ef" font-family="'Sora', system-ui, sans-serif" font-weight="300" font-size="17">78</text>
      </svg>
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <span style="font-size: 15px; letter-spacing: 0.4px;">Recovery</span>
        <span style="font-size: 12px; color: #5b5963;">Ready for load</span>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 16px;">
      <svg width="60" height="60" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
        <circle cx="30" cy="30" r="26" fill="none" stroke="#191a1e" stroke-width="6"></circle>
        <circle cx="30" cy="30" r="26" fill="none" stroke="#989cdb" stroke-width="6" stroke-linecap="round" stroke-dasharray="163.36" stroke-dashoffset="16.34" transform="rotate(-90 30 30)"></circle>
        <text x="30" y="35" text-anchor="middle" fill="#f5f3ef" font-family="'Sora', system-ui, sans-serif" font-weight="300" font-size="17">90</text>
      </svg>
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <span style="font-size: 15px; letter-spacing: 0.4px;">Sleep</span>
        <span style="font-size: 12px; color: #5b5963;">7 h 12 m recorded</span>
      </div>
    </div>

  </div>
  <div style="font-size: 11px; letter-spacing: 1.6px; color: #5b5963; text-transform: uppercase;">Style 2 · Stacked list — compact</div>
</div>
</x-dc>
</body>
</html>
