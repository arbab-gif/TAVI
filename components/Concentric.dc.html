<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Sora:wght@200;300;400;600&display=swap");
    body { margin: 0; }
    a { color: #e2ab61; } a:hover { color: #c78f45; }
  </style>
</helmet>
<div style="width: 400px; height: 440px; box-sizing: border-box; background: #08080a; color: #f5f3ef; font-family: 'Sora', system-ui, sans-serif; padding: 28px 24px; display: flex; flex-direction: column; align-items: center; justify-content: space-between;">
  <svg width="300" height="300" viewBox="0 0 360 360" xmlns="http://www.w3.org/2000/svg">
    <!-- Core outer (dominant) -->
    <circle cx="180" cy="180" r="122" fill="none" stroke="#191a1e" stroke-width="15"></circle>
    <circle cx="180" cy="180" r="122" fill="none" stroke="#e2ab61" stroke-width="15" stroke-linecap="round" stroke-dasharray="766.55" stroke-dashoffset="137.98" transform="rotate(-90 180 180)"></circle>
    <!-- Recovery middle -->
    <circle cx="180" cy="180" r="94" fill="none" stroke="#191a1e" stroke-width="15"></circle>
    <circle cx="180" cy="180" r="94" fill="none" stroke="#7cc2a3" stroke-width="15" stroke-linecap="round" stroke-dasharray="590.62" stroke-dashoffset="129.94" transform="rotate(-90 180 180)"></circle>
    <!-- Sleep inner -->
    <circle cx="180" cy="180" r="66" fill="none" stroke="#191a1e" stroke-width="15"></circle>
    <circle cx="180" cy="180" r="66" fill="none" stroke="#989cdb" stroke-width="15" stroke-linecap="round" stroke-dasharray="414.69" stroke-dashoffset="41.47" transform="rotate(-90 180 180)"></circle>
    <!-- center -->
    <text x="180" y="176" text-anchor="middle" fill="#f5f3ef" font-family="'Sora', system-ui, sans-serif" font-weight="200" font-size="40">82<tspan font-size="18" dy="-16">%</tspan></text>
    <text x="180" y="200" text-anchor="middle" fill="#96949d" font-family="'Sora', system-ui, sans-serif" font-weight="400" font-size="11" letter-spacing="1.5">CORE</text>
  </svg>
  <div style="display: flex; gap: 22px; align-items: center;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
      <div style="display: flex; align-items: center; gap: 6px; font-size: 11px; letter-spacing: 1px; color: #96949d;"><span style="width: 8px; height: 8px; border-radius: 50%; background: #e2ab61;"></span>CORE</div>
      <div style="font-weight: 300; font-size: 17px;">82%</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
      <div style="display: flex; align-items: center; gap: 6px; font-size: 11px; letter-spacing: 1px; color: #96949d;"><span style="width: 8px; height: 8px; border-radius: 50%; background: #7cc2a3;"></span>RECOVERY</div>
      <div style="font-weight: 300; font-size: 17px;">78%</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
      <div style="display: flex; align-items: center; gap: 6px; font-size: 11px; letter-spacing: 1px; color: #96949d;"><span style="width: 8px; height: 8px; border-radius: 50%; background: #989cdb;"></span>SLEEP</div>
      <div style="font-weight: 300; font-size: 17px;">90%</div>
    </div>
  </div>
  <div style="font-size: 11px; letter-spacing: 1.6px; color: #5b5963; text-transform: uppercase;">B · Concentric dial</div>
</div>
</x-dc>
</body>
</html>
